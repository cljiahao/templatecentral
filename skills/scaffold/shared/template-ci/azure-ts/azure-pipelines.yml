# PR and main-branch pipeline for the TS stacks; merge gates come from azure-pipelines/templatecentral-gates.yml.
trigger:
  branches: { include: [main] }
pr:
  branches: { include: [main, uat, develop] }
pool:
  vmImage: ubuntu-latest
variables:
  # changed-line coverage tool; bump deliberately, it decides what fails the build
  diffCoverVersion: "11.0.3"
  # the one knob for test sharding: raise it to split the suite across more agents
  shardCount: 4
  # caps each Node process; the test workers inherit it
  NODE_OPTIONS: --max-old-space-size=4096
jobs:
  - job: quality
    timeoutInMinutes: 20
    steps:
      - checkout: self
        # diff-cover and the PR-only gates need full history
        fetchDepth: 0
      - task: NodeTool@0
        inputs: { versionSpec: "26.x" }
        displayName: Node 26
      - bash: npm install -g "$(node -p "require('./package.json').packageManager.split('+')[0]")"
        displayName: pnpm (the version pinned in packageManager)
      # lockfile-in-sync gate
      - bash: pnpm install --frozen-lockfile
        displayName: Install deps
      - template: azure-pipelines/templatecentral-gates.yml
      # format:check + lint + typecheck
      - bash: pnpm run check
        displayName: Format, lint and typecheck
      - bash: pnpm exec jscpd
        displayName: Duplication (production source <= 3%, per .jscpd.json)
  - job: test
    timeoutInMinutes: 20
    strategy:
      parallel: ${{ variables.shardCount }}
    steps:
      - checkout: self
      - task: NodeTool@0
        inputs: { versionSpec: "26.x" }
        displayName: Node 26
      - bash: npm install -g "$(node -p "require('./package.json').packageManager.split('+')[0]")"
        displayName: pnpm (the version pinned in packageManager)
      - bash: pnpm install --frozen-lockfile
        displayName: Install deps
      - bash: pnpm exec vitest run --coverage --reporter=default --reporter=blob --outputFile.blob="blob/shard-$(System.JobPositionInPhase).json" --shard="$(System.JobPositionInPhase)/$(System.TotalJobsInPhase)"
        displayName: Tests (this shard, coverage in the blob report)
      - task: PublishPipelineArtifact@1
        inputs: { targetPath: blob, artifact: "vitest-blob-$(System.JobPositionInPhase)" }
        displayName: Publish shard report
  - job: coverage
    dependsOn: test
    timeoutInMinutes: 10
    steps:
      - checkout: self
        # diff-cover needs full history
        fetchDepth: 0
      - task: NodeTool@0
        inputs: { versionSpec: "26.x" }
        displayName: Node 26
      - bash: npm install -g "$(node -p "require('./package.json').packageManager.split('+')[0]")"
        displayName: pnpm (the version pinned in packageManager)
      - bash: pnpm install --frozen-lockfile
        displayName: Install deps
      - task: DownloadPipelineArtifact@2
        inputs: { patterns: "vitest-blob-*/**", path: "$(Pipeline.Workspace)/blobs" }
        displayName: Download shard reports
      - bash: |
          set -euo pipefail
          # No artifact name, so the task puts each artifact in its own subfolder: <path>/<artifact>/*.json.
          mkdir -p blob
          cp "$(Pipeline.Workspace)"/blobs/*/*.json blob/
        displayName: Collect shard reports
      # Own step: a missing shard must fail the job, not shrink coverage.
      - bash: |
          set -euo pipefail
          count=$(find blob -name '*.json' | wc -l)
          if [ "$count" -ne "$(shardCount)" ]; then
            echo "expected $(shardCount) shard reports, found $count" >&2
            exit 1
          fi
        displayName: Assert all shard reports present
      - bash: |
          set -euo pipefail
          # writes coverage/cobertura-coverage.xml
          pnpm exec vitest run --merge-reports=blob --coverage
        displayName: Merge shard reports
      - bash: pnpm exec vitest run --merge-reports=blob --reporter=json --outputFile.json=report/merged.json
        displayName: Build one test report from the shard reports
      - bash: pnpm exec vitest run -t '^$' --reporter=json --outputFile.json=report/collected.json
        displayName: Count the tests without sharding (collection only, no test body runs)
      - bash: |
          set -euo pipefail
          node -e '
          const fs = require("node:fs");
          const read = (f) => JSON.parse(fs.readFileSync(f, "utf8"));
          const merged = read("report/merged.json");
          const collected = read("report/collected.json");
          console.log("merged " + merged.numTotalTests + ", unsharded " + collected.numTotalTests + ", failed " + merged.numFailedTests);
          const ok = merged.numTotalTests === collected.numTotalTests && merged.numTotalTests > 0 && merged.numFailedTests === 0;
          process.exit(ok ? 0 : 1);
          '
        displayName: Require the merged test count to equal the unsharded count
      - bash: |
          set -euo pipefail
          target=${SYSTEM_PULLREQUEST_TARGETBRANCH:-main}
          pipx run "diff-cover==$(diffCoverVersion)" coverage/cobertura-coverage.xml --compare-branch="origin/${target#refs/heads/}" --fail-under=80
        displayName: Changed-line coverage (>= 80%)
