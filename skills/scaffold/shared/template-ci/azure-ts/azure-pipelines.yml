# PR and main-branch pipeline for Azure DevOps (TS stacks). The harness merge gates live in the
# included azure-pipelines/templatecentral-gates.yml; this file adds install, lint, typecheck and tests.
trigger:
  branches: { include: [main] }
pr:
  branches: { include: [main, uat, develop] }
pool:
  vmImage: ubuntu-latest
variables:
  shardCount: 2    # the one knob for test sharding: raise it to split the suite across more agents
  NODE_OPTIONS: --max-old-space-size=4096    # caps each Node process (the test workers inherit it)
jobs:
  - job: quality
    timeoutInMinutes: 20
    steps:
      - checkout: self
        fetchDepth: 0    # diff-cover and the PR-only gates need full history
      - task: NodeTool@0
        inputs: { versionSpec: "24.x" }
        displayName: Node 24
      - bash: npm install -g "$(node -p "require('./package.json').packageManager.split('+')[0]")"
        displayName: pnpm (the version pinned in packageManager)
      - bash: pnpm install --frozen-lockfile    # lockfile-in-sync gate
        displayName: Install deps
      - template: azure-pipelines/templatecentral-gates.yml
      - bash: pnpm run check                    # format:check + lint + typecheck
        displayName: Format, lint and typecheck
      - bash: pnpm exec jscpd src --threshold 3 --reporters console
        displayName: Duplication (<= 3%, the SonarQube new-code gate)
  - job: test
    timeoutInMinutes: 20
    strategy:
      parallel: ${{ variables.shardCount }}
    steps:
      - checkout: self
      - task: NodeTool@0
        inputs: { versionSpec: "24.x" }
        displayName: Node 24
      - bash: npm install -g "$(node -p "require('./package.json').packageManager.split('+')[0]")"
        displayName: pnpm (the version pinned in packageManager)
      - bash: pnpm install --frozen-lockfile
        displayName: Install deps
      - bash: pnpm exec vitest run --coverage --reporter=blob --outputFile.blob="blob/shard-$(System.JobPositionInPhase).json" --shard="$(System.JobPositionInPhase)/$(System.TotalJobsInPhase)"
        displayName: Tests (this shard, coverage in the blob report)
      - task: PublishPipelineArtifact@1
        inputs: { targetPath: blob, artifact: "vitest-blob-$(System.JobPositionInPhase)" }
        displayName: Publish shard report
  - job: coverage
    dependsOn: test
    timeoutInMinutes: 10
    steps:
      - checkout: self
        fetchDepth: 0    # diff-cover needs full history
      - task: NodeTool@0
        inputs: { versionSpec: "24.x" }
        displayName: Node 24
      - bash: npm install -g "$(node -p "require('./package.json').packageManager.split('+')[0]")"
        displayName: pnpm (the version pinned in packageManager)
      - bash: pnpm install --frozen-lockfile
        displayName: Install deps
      - task: DownloadPipelineArtifact@2
        inputs: { patterns: "vitest-blob-*/**", path: "$(Pipeline.Workspace)/blobs" }
        displayName: Download shard reports
      - bash: |
          mkdir -p blob
          cp "$(Pipeline.Workspace)"/blobs/*/*.json blob/
          pnpm exec vitest run --merge-reports=blob --coverage    # writes coverage/cobertura-coverage.xml
        displayName: Merge shard reports
      - bash: |
          target=${SYSTEM_PULLREQUEST_TARGETBRANCH:-main}
          pipx run diff-cover coverage/cobertura-coverage.xml --compare-branch="origin/${target#refs/heads/}" --fail-under=80
        displayName: Changed-line coverage (>= 80%)
