version: 2
updates:
  # weekly, minor and patch updates grouped into one pull request
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  # keeps the SHA-pinned actions current
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
