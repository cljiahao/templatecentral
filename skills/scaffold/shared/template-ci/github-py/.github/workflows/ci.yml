name: CI
on:
  pull_request: { branches: [main, uat, develop] }
  push: { branches: [main] }
permissions: { contents: read }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  # duplication scanner; bump deliberately, it decides what fails the build. `npx jscpd@<version>` pins jscpd only, not its transitive dependencies
  JSCPD_VERSION: "5.4.3"
  # changed-line coverage tool; bump deliberately, it decides what fails the build
  DIFF_COVER_VERSION: "11.0.3"
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - if: hashFiles('uv.lock') != ''
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install deps
        run: |
          set -euo pipefail
          # The licence and SBOM gates read the project environment at .venv.
          if [ -n "$(git ls-files .venv)" ]; then echo "::error::.venv is tracked by git; remove it (git rm -r --cached .venv): a committed environment is not trusted."; exit 1; fi
          # python -I: the project folder is not on sys.path, so a root venv.py or pip/ cannot stand in for the stdlib module or pip.
          python -I -m venv --clear .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/python -I -m pip install --require-hashes -r requirements.txt
      - name: Dependency audit (high/critical; allowlist .claude/dep-audit-allow.txt)
        run: bash .claude/ci-gates.sh deps
      - name: Harness integrity
        run: bash .claude/verify-harness.sh
      - name: Docs check (links and paths in README.md, AGENTS.md, docs/)
        run: bash scripts/check-docs.sh
      - name: Test budget (test code <= 35 lines per 100 source lines, ADR-0001)
        run: bash .claude/ci-gates.sh testbudget
      - name: No NOSONAR suppression markers
        run: bash .claude/ci-gates.sh nosonar
      - name: Supply chain (install scripts, release age, lockfile hosts, frozen installs)
        run: bash .claude/ci-gates.sh supplychain
      - name: Workflow hardening (pinned actions, token permissions, no injection)
        run: bash .claude/ci-gates.sh workflows
      - name: .env.example matches the variables the code reads
        run: bash .claude/ci-gates.sh envexample
      - name: Dockerfile lint (digest pin, non-root USER, hadolint)
        run: bash .claude/ci-gates.sh dockerfile
      - name: Licences (every installed dependency has an allowed licence)
        run: bash .claude/ci-gates.sh licences
      - name: SBOM (CycloneDX bill of materials matches the lockfile)
        run: bash .claude/ci-gates.sh sbom
      # PR: the PR's commits; push: full history
      - name: Secret scan (gitleaks CLI, checksum-verified)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash .claude/ci-gates.sh secrets "$BASE_REF"
      - name: Change size (the PR stays within the line and file budget)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash .claude/ci-gates.sh changesize "$BASE_REF"
      - name: Duplicate tests (no two cases with the same body and context)
        run: bash .claude/ci-gates.sh duptests
      - name: Exclude reasons (every coverage, Sonar and mutation exclude has a reason)
        run: bash .claude/ci-gates.sh exclusions
      - name: Comment shape (added comments are short, above a statement, never a bare disable)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash .claude/ci-gates.sh commentshape "$BASE_REF"
      - name: Bundle size (gzip JS and CSS within .claude/bundle-budget.txt)
        run: bash .claude/ci-gates.sh bundle
      - name: Duplication (production source <= 3%, per .jscpd.json)
        # Pinned by JSCPD_VERSION; bump it deliberately.
        run: npx --yes jscpd@${JSCPD_VERSION}
      # Dev tools install after every gate that does not need them; only the budget note, which reports last, runs after the tests.
      - name: Install dev tools and check their licences (after the licence and SBOM gates)
        run: |
          set -euo pipefail
          if [ -f requirements-dev.txt ]; then
            .venv/bin/python -I -m pip install -r requirements-dev.txt
            LICENCES_SCOPE=all bash scripts/check-licences.sh
          fi
      - run: ruff check src/ test/ && ruff format --check src/ test/
      - run: python -I -m pyright src/
      # Serial on purpose: xdist measured slower at this suite size.
      - name: Tests (serial; pytest-cov writes coverage.xml)
        run: python -m pytest test/ --cov=src --cov-report=xml -q
      - name: Changed-line coverage (>= 80%)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          pipx run "diff-cover==${DIFF_COVER_VERSION}" coverage.xml --compare-branch="origin/${BASE_REF:-main}" --fail-under=80 | tee diff-cover.txt
      - name: Changed source has covered lines (fails closed on an empty report)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash .claude/ci-gates.sh diffcover "$BASE_REF"
      # Prints the gate-time note for the gates this job ran. Exits 0 when over budget and 2 when the budget file, gate list or timing record is broken. Skipped when an earlier step fails.
      - name: Gate-time budget note
        run: bash .claude/gate-budget.sh check
  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Require CHANGELOG for src changes (apply 'skip-changelog' label to bypass)
        env:
          BASE_REF: ${{ github.base_ref }}
          LABELS: "${{ join(github.event.pull_request.labels.*.name, ' ') }}"
        run: bash .claude/ci-gates.sh changelog "$BASE_REF"
  comment-hygiene:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Require no change-narration comments (apply 'skip-comment-check' label to bypass)
        env:
          BASE_REF: ${{ github.base_ref }}
          LABELS: "${{ join(github.event.pull_request.labels.*.name, ' ') }}"
        run: bash .claude/ci-gates.sh comments "$BASE_REF"
  workarounds:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Require no suppression markers and no removed covering tests
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash .claude/ci-gates.sh workarounds "$BASE_REF"
  gate-ratchet:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      # The merge-base copy of ci-gates.sh runs, so a PR cannot rewrite the entry point that judges it.
      - name: Require no weaker gate config (apply 'allow-gate-change' label to bypass)
        env:
          BASE_REF: ${{ github.base_ref }}
          LABELS: "${{ join(github.event.pull_request.labels.*.name, ' ') }}"
        run: |
          set -euo pipefail
          if ! base_sha=$(git rev-parse --verify --quiet "origin/$BASE_REF^{commit}"); then echo "::error::origin/$BASE_REF not found; check out with fetch-depth: 0"; exit 1; fi
          if ! mbase=$(git merge-base "$base_sha" HEAD); then echo "::error::no merge base with origin/$BASE_REF; check out with fetch-depth: 0"; exit 1; fi
          tmp=$(mktemp "$RUNNER_TEMP/ci-gates.XXXXXX")
          trap 'rm -f "$tmp"' EXIT
          if git cat-file -e "$mbase:.claude/ci-gates.sh" 2>/dev/null; then git show "$mbase:.claude/ci-gates.sh" > "$tmp"; cp "$tmp" .claude/ci-gates.sh; fi
          bash .claude/ci-gates.sh ratchet "$BASE_REF"
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # fails the PR when it adds a dependency with a high or critical advisory
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with: { fail-on-severity: high }
