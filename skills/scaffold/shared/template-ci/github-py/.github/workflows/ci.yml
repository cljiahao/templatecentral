name: CI
on:
  pull_request: { branches: [main, uat, develop] }
  push: { branches: [main] }
permissions: { contents: read }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  # duplication scanner; bump deliberately, it decides what fails the build. `npx jscpd@<version>` pins jscpd only, not its transitive dependencies
  JSCPD_VERSION: "5.4.3"
  # changed-line coverage tool; bump deliberately, it decides what fails the build
  DIFF_COVER_VERSION: "11.0.3"
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - if: hashFiles('uv.lock') != ''
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Install deps
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      - name: Dependency audit (high/critical; allowlist .claude/dep-audit-allow.txt)
        run: bash .claude/ci-gates.sh deps
      - name: Harness integrity
        run: bash .claude/verify-harness.sh
      - name: No NOSONAR suppression markers
        run: bash .claude/ci-gates.sh nosonar
      - run: ruff check src/ test/ && ruff format --check src/ test/
      - run: python -m pyright src/
      - name: Duplication (production source <= 3%, per .jscpd.json)
        # Pinned by JSCPD_VERSION; bump it deliberately.
        run: npx --yes jscpd@${JSCPD_VERSION}
      - name: Tests (pytest-xdist workers; pytest-cov combines their data into coverage.xml)
        run: python -m pytest test/ -n auto --cov=src --cov-report=xml -q
      - name: Changed-line coverage (>= 80%)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: pipx run "diff-cover==${DIFF_COVER_VERSION}" coverage.xml --compare-branch="origin/${BASE_REF:-main}" --fail-under=80
      # PR: the PR's commits; push: full history
      - name: Secret scan (gitleaks CLI, checksum-verified)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash .claude/ci-gates.sh secrets "$BASE_REF"
  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: Require CHANGELOG for src changes (apply 'skip-changelog' label to bypass)
        env:
          BASE_REF: ${{ github.base_ref }}
          LABELS: "${{ join(github.event.pull_request.labels.*.name, ' ') }}"
        run: bash .claude/ci-gates.sh changelog "$BASE_REF"
  readme-freshness:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: Require README.md update for changed folders (apply 'skip-readme-check' label to bypass)
        env:
          BASE_REF: ${{ github.base_ref }}
          LABELS: "${{ join(github.event.pull_request.labels.*.name, ' ') }}"
        run: bash .claude/ci-gates.sh readme "$BASE_REF"
  comment-hygiene:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: Require no change-narration comments (apply 'skip-comment-check' label to bypass)
        env:
          BASE_REF: ${{ github.base_ref }}
          LABELS: "${{ join(github.event.pull_request.labels.*.name, ' ') }}"
        run: bash .claude/ci-gates.sh comments "$BASE_REF"
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # fails the PR when it adds a dependency with a high or critical advisory
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with: { fail-on-severity: high }
