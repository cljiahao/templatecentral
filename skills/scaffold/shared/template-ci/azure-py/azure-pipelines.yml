# PR and main-branch pipeline for FastAPI; merge gates come from azure-pipelines/templatecentral-gates.yml.
trigger:
  branches: { include: [main] }
pr:
  branches: { include: [main, uat, develop] }
pool:
  vmImage: ubuntu-latest
variables:
  # duplication scanner; bump deliberately, it decides what fails the build. `npx jscpd@<version>` pins jscpd only, not its transitive dependencies
  JSCPD_VERSION: "5.4.3"
  # changed-line coverage tool; bump deliberately, it decides what fails the build
  DIFF_COVER_VERSION: "11.0.3"
jobs:
  - job: quality
    timeoutInMinutes: 20
    steps:
      - checkout: self
        # diff-cover and the PR-only gates need full history
        fetchDepth: 0
      - task: UsePythonVersion@0
        inputs: { versionSpec: "3.14" }
        displayName: Python 3.14
      - bash: |
          set -euo pipefail
          # The licence and SBOM gates read the project environment at .venv.
          if [ -n "$(git ls-files .venv)" ]; then echo "##vso[task.logissue type=error].venv is tracked by git; remove it (git rm -r --cached .venv): a committed environment is not trusted."; exit 1; fi
          python -m venv --clear .venv
          echo "##vso[task.setvariable variable=VIRTUAL_ENV]$PWD/.venv"
          echo "##vso[task.prependpath]$PWD/.venv/bin"
          .venv/bin/python -m pip install --require-hashes -r requirements.txt
          if [ -f requirements-dev.txt ]; then .venv/bin/python -m pip install -r requirements-dev.txt; fi
          # the deps gate exports uv.lock with uv
          if [ -f uv.lock ]; then .venv/bin/python -m pip install uv==0.13.7; fi
        displayName: Install deps
      - template: azure-pipelines/templatecentral-gates.yml
      - bash: ruff check src/ test/ && ruff format --check src/ test/
        displayName: Lint and format check
      - bash: python -m pyright src/
        displayName: Typecheck
      # Pinned by JSCPD_VERSION; bump it deliberately.
      - bash: npx --yes jscpd@$(JSCPD_VERSION)
        displayName: Duplication (production source <= 3%, per .jscpd.json)
      # Serial on purpose: xdist measured slower at this suite size.
      - bash: python -m pytest test/ --cov=src --cov-report=xml -q
        displayName: Tests with coverage
      - bash: |
          set -euo pipefail
          target=${SYSTEM_PULLREQUEST_TARGETBRANCH:-main}
          pipx run "diff-cover==$(DIFF_COVER_VERSION)" coverage.xml --compare-branch="origin/${target#refs/heads/}" --fail-under=80 | tee diff-cover.txt
        displayName: Changed-line coverage (>= 80%)
      - bash: bash .claude/ci-gates.sh diffcover "${SYSTEM_PULLREQUEST_TARGETBRANCH:-}"
        displayName: Changed source has covered lines (fails closed on an empty report)
