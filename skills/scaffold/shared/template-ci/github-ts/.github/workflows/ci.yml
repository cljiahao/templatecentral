name: CI
on:
  pull_request: { branches: [main, uat, develop] }
  push: { branches: [main] }
permissions: { contents: read }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  # changed-line coverage tool; bump deliberately, it decides what fails the build
  DIFF_COVER_VERSION: "11.0.3"
  # the one knob for test sharding: raise it to split the suite across more runners
  SHARD_COUNT: "2"
  # caps each Node process; the test workers inherit it
  NODE_OPTIONS: --max-old-space-size=4096
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      shards: ${{ steps.shards.outputs.list }}
    steps:
      - id: shards
        run: |
          set -euo pipefail
          list=$(node -p 'JSON.stringify(Array.from({ length: Number(process.env.SHARD_COUNT) }, (_, i) => i + 1))')
          echo "list=$list" >> "$GITHUB_OUTPUT"
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # SHA-pinned per Skills Security; re-verify or bump via the review utility, do not hand-edit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # diff-cover needs full history
        with: { fetch-depth: 0 }
      # No `version:` input: pnpm/action-setup reads packageManager from package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "24", cache: pnpm }
      # lockfile-in-sync gate
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit (high/critical; allowlist .claude/dep-audit-allow.txt)
        run: bash .claude/ci-gates.sh deps
      - name: Harness integrity
        run: bash .claude/verify-harness.sh
      - name: No NOSONAR suppression markers
        run: bash .claude/ci-gates.sh nosonar
      # format:check + lint + typecheck
      - run: pnpm run check
      - name: Duplication (production source <= 3%, per .jscpd.json)
        run: pnpm exec jscpd
      - name: End-to-end tests (only when package.json defines test:e2e)
        run: |
          set -euo pipefail
          if node -e "process.exit(require('./package.json').scripts?.['test:e2e'] ? 0 : 1)"; then pnpm run test:e2e; fi
      # PR: the PR's commits; push: full history
      - name: Secret scan (gitleaks CLI, checksum-verified)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash .claude/ci-gates.sh secrets "$BASE_REF"
  test:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No `version:` input: pnpm/action-setup reads packageManager from package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "24", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Tests (shard ${{ matrix.shard }}/${{ env.SHARD_COUNT }}, coverage in the blob report)
        run: pnpm exec vitest run --coverage --reporter=default --reporter=blob --outputFile.blob="blob/shard-${{ matrix.shard }}.json" --shard="${{ matrix.shard }}/${{ env.SHARD_COUNT }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: blob
          if-no-files-found: error
          retention-days: 1
  coverage:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # diff-cover needs full history
        with: { fetch-depth: 0 }
      # No `version:` input: pnpm/action-setup reads packageManager from package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "24", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vitest-blob-*
          path: blob
          merge-multiple: true
      - name: Require one blob report per shard (a missing shard must fail, not shrink coverage)
        run: '[ "$(find blob -name "*.json" | wc -l)" -eq "$SHARD_COUNT" ]'
      - name: Merge shard reports (writes coverage/cobertura-coverage.xml)
        run: pnpm exec vitest run --merge-reports=blob --coverage
      - name: Changed-line coverage (>= 80%)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: pipx run "diff-cover==${DIFF_COVER_VERSION}" coverage/cobertura-coverage.xml --compare-branch="origin/${BASE_REF:-main}" --fail-under=80
  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: Require CHANGELOG for src changes (apply 'skip-changelog' label to bypass)
        env:
          BASE_REF: ${{ github.base_ref }}
          LABELS: "${{ join(github.event.pull_request.labels.*.name, ' ') }}"
        run: bash .claude/ci-gates.sh changelog "$BASE_REF"
  readme-freshness:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: Require README.md update for changed folders (apply 'skip-readme-check' label to bypass)
        env:
          BASE_REF: ${{ github.base_ref }}
          LABELS: "${{ join(github.event.pull_request.labels.*.name, ' ') }}"
        run: bash .claude/ci-gates.sh readme "$BASE_REF"
  comment-hygiene:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: Require no change-narration comments (apply 'skip-comment-check' label to bypass)
        env:
          BASE_REF: ${{ github.base_ref }}
          LABELS: "${{ join(github.event.pull_request.labels.*.name, ' ') }}"
        run: bash .claude/ci-gates.sh comments "$BASE_REF"
