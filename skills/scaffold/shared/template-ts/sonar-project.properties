# SonarQube / SonarCloud project settings. Set sonar.projectKey (and sonar.organization on SonarCloud)
# where the project is registered, then run the scanner from CI with a project-owned token and host URL.
# Targets the default "Sonar way" gate on new code: 0 new issues, 100% security hotspots reviewed,
# coverage >= 80%, duplication <= 3%.
sonar.sources=.
sonar.inclusions=src/**,test/**
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/coverage/**,**/*.d.ts
sonar.test.inclusions=test/**,src/test/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
