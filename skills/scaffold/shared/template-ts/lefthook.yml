# Git-hook layer. Install once with pnpm exec lefthook install; the prepare script runs it automatically.
pre-commit:
  # Sequential: the lockfile step's pnpm install rewrites node_modules and would race tsc/eslint/prettier.
  parallel: false
  commands:
    format-lint:
      glob: "*.{ts,tsx,js,mjs,cjs}"
      # eslint --fix first, prettier last, so a removed disable comment leaves no prettier failure; hashed hooks stay excluded.
      exclude:
        - .claude/hooks/*
        - .claude/.harness-base/**
      run: pnpm exec eslint --fix --max-warnings=0 --no-warn-ignored {staged_files} && pnpm exec prettier --write {staged_files}
      stage_fixed: true
    typecheck:
      run: pnpm exec tsc --noEmit --incremental
    lockfile:
      glob: "package.json"
      run: pnpm install --frozen-lockfile
    secret-scan:
      # Scans staged changes when the scanner is installed; the next command warns or fails when it is not.
      run: if command -v gitleaks >/dev/null 2>&1; then gitleaks git --pre-commit --staged --redact --no-banner -v; fi
      fail_text: Secret found (file, line and rule above, value hidden). Remove it and read it from the environment instead; if it was ever committed or pushed, treat it as exposed and replace it where it was issued.
    scanner-present:
      # Never a silent skip: warns with the install command locally and fails in CI.
      run: bash scripts/check-secret-scanner.sh
    docs-check:
      # Fails on a broken link or path in staged docs; CI and pre-push run the full check.
      glob: "*.md"
      run: bash scripts/check-docs.sh {staged_files}
    env-example:
      # Fails when the variables the code reads and .env.example disagree; reads source files and .env.example only.
      glob: "{src/**,app/**,lib/**,.env.example,next.config.*,vite.config.*}"
      run: bash scripts/check-env-example.sh
    workflow-lint:
      glob: "{.github/workflows/*,azure-pipelines.yml,azure-pipelines/*}"
      run: bash scripts/check-workflows.sh
    dockerfile-lint:
      glob: "{Dockerfile,Dockerfile.*}"
      run: bash scripts/check-dockerfile.sh
    supply-chain:
      glob: "{pnpm-workspace.yaml,pnpm-lock.yaml,.npmrc,requirements*.txt,uv.lock,.github/dependabot.yml,.claude/registry-hosts.txt}"
      run: bash scripts/check-supply-chain.sh
    comment-hygiene:
      # Warn-only, never blocks. Patterns come from .claude/comment-hygiene-patterns.txt.
      run: |
        patterns=".claude/comment-hygiene-patterns.txt"
        [ -f "$patterns" ] || exit 0
        nl=$(printf '\nx'); nl=${nl%x}
        flagged=""
        # sh has no `read -d ''`: stage the NUL-separated list in a temp file so paths with spaces survive.
        staged=$(mktemp)
        git diff --cached --name-only -z | tr '\0' '\n' > "$staged"
        while IFS= read -r f <&3; do
          case "$f" in *.ts|*.tsx|*.js|*.jsx|*.mjs|*.cjs|*.py) ;; *) continue ;; esac
          [ -f "$f" ] || continue
          block_len=0
          prev_lineno=0
          candidates=$(mktemp)
          grep -nE '^[[:space:]]*(#|//|\*|"""|/\*\*?)' "$f" > "$candidates" || true
          while IFS= read -r cline; do
            lineno="${cline%%:*}"
            content="${cline#*:}"
            if [ "$prev_lineno" -ne 0 ] && [ "$lineno" -ne $((prev_lineno + 1)) ]; then
              [ "$block_len" -gt 5 ] && flagged="$flagged$nl  - $f: oversized comment block ($block_len lines)"
              block_len=0
            fi
            stripped=$(printf '%s' "$content" | sed -E 's@^[[:space:]]*(#|//|\*|"""|/\*\*?)[[:space:]]?@@')
            if [ -n "$stripped" ] && printf '%s' "$stripped" | grep -qEf "$patterns"; then
              flagged="$flagged$nl  - $f: $stripped"
            fi
            if printf '%s' "$content" | grep -qE '^[[:space:]]*(#|//)'; then
              block_len=$((block_len + 1))
            else
              [ "$block_len" -gt 5 ] && flagged="$flagged$nl  - $f: oversized comment block ($block_len lines)"
              block_len=0
            fi
            prev_lineno="$lineno"
          done < "$candidates"
          rm -f "$candidates"
          [ "$block_len" -gt 5 ] && flagged="$flagged$nl  - $f: oversized comment block ($block_len lines, end of file)"
        done 3< "$staged"
        rm -f "$staged"
        if [ -n "$flagged" ]; then
          echo "⚠ comment hygiene (commit still proceeds):"
          printf '%s\n' "$flagged"
        fi
        exit 0

commit-msg:
  commands:
    conventional:
      run: bash .lefthook/commit-msg.sh {1}
pre-push:
  commands:
    harness-integrity:
      run: bash .claude/verify-harness.sh
    docs-check:
      run: bash scripts/check-docs.sh
    test-budget:
      run: bash scripts/test-budget.sh
    gate-ratchet:
      # Fails when a coverage threshold, an exclude or another gate setting is weaker than on the base branch; the same check runs in CI.
      run: bash scripts/gate-ratchet.sh auto
    workarounds:
      # Fails on a lint, type, coverage or test suppression this change adds, and on a deleted test whose source remains.
      run: bash scripts/check-workarounds.sh
    review-record:
      # Fails when HEAD has no passing in-session review record; run scripts/record-review.sh to make one. Records are local, so CI skips it.
      run: bash scripts/check-review-record.sh
    licences:
      # Fails when an installed dependency has a licence that .claude/allowed-licences.txt does not list. Install the dependencies first.
      run: bash scripts/check-licences.sh
    sbom:
      # Writes the CycloneDX bill of materials to dist/sbom and fails when it does not match the lockfile.
      run: bash scripts/generate-sbom.sh
    duplicate-tests:
      # Fails when two test cases have the same body and context, or one shape repeats and should be a parameterised test.
      run: bash scripts/check-duplicate-tests.sh
    exclude-reasons:
      # Fails when a coverage, Sonar or mutation exclude has no reason: line above it, or hides a whole source scope.
      run: bash scripts/check-exclude-reasons.sh
    comment-shape:
      # Fails on a comment this branch adds that is long, a parenthetical aside, inside a function body, or a bare disable. Needs the project's own typescript in node_modules for TS files.
      run: bash scripts/check-comments.sh
    change-size:
      # Fails when the branch changes more lines or files than the change-size budget, so reviews stay small.
      run: bash scripts/check-change-size.sh
    bundle-size:
      # Deletes the old build output, builds, then fails when the gzip size of the emitted JS and CSS is over .claude/bundle-budget.txt. Only Next.js and Vite projects emit a bundle, other stacks skip the build.
      run: bash scripts/check-bundle-size.sh --build
    verify:
      # test:ci runs the 80% line floor that plain test skips.
      run: pnpm run check && pnpm run test:ci
