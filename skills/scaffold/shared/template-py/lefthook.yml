pre-commit:
  # Sequential on purpose: format-lint rewrites staged files that pyright reads.
  parallel: false
  commands:
    format-lint:
      glob: "*.py"
      # Reformatting a hashed hook would make verify-harness.sh report MODIFIED.
      exclude:
        - .claude/hooks/*
        - .claude/.harness-base/**
      run: '[ -f .venv/bin/activate ] && . .venv/bin/activate; ruff format {staged_files} && ruff check --fix {staged_files}'
      stage_fixed: true
    typecheck:
      run: '[ -f .venv/bin/activate ] && . .venv/bin/activate; python -m pyright src/'
    secret-scan:
      # Skips only when gitleaks isn't installed locally; CI is the hard gate, and a finding fails the commit.
      run: if command -v gitleaks >/dev/null 2>&1; then gitleaks git --pre-commit --staged --redact --no-banner; fi
    docs-check:
      # Fails on a broken link or path in staged docs; CI and pre-push run the full check.
      glob: "*.md"
      run: bash scripts/check-docs.sh {staged_files}
    comment-hygiene:
      # Warn-only, never blocks. Patterns come from .claude/comment-hygiene-patterns.txt.
      run: |
        patterns=".claude/comment-hygiene-patterns.txt"
        [ -f "$patterns" ] || exit 0
        nl=$(printf '\nx'); nl=${nl%x}
        flagged=""
        # sh has no `read -d ''`: stage the NUL-separated list in a temp file so paths with spaces survive.
        staged=$(mktemp)
        git diff --cached --name-only -z | tr '\0' '\n' > "$staged"
        while IFS= read -r f <&3; do
          case "$f" in *.ts|*.tsx|*.js|*.jsx|*.mjs|*.cjs|*.py) ;; *) continue ;; esac
          [ -f "$f" ] || continue
          block_len=0
          prev_lineno=0
          candidates=$(mktemp)
          grep -nE '^[[:space:]]*(#|//|\*|"""|/\*\*?)' "$f" > "$candidates" || true
          while IFS= read -r cline; do
            lineno="${cline%%:*}"
            content="${cline#*:}"
            if [ "$prev_lineno" -ne 0 ] && [ "$lineno" -ne $((prev_lineno + 1)) ]; then
              [ "$block_len" -gt 5 ] && flagged="$flagged$nl  - $f: oversized comment block ($block_len lines)"
              block_len=0
            fi
            stripped=$(printf '%s' "$content" | sed -E 's@^[[:space:]]*(#|//|\*|"""|/\*\*?)[[:space:]]?@@')
            if [ -n "$stripped" ] && printf '%s' "$stripped" | grep -qEf "$patterns"; then
              flagged="$flagged$nl  - $f: $stripped"
            fi
            if printf '%s' "$content" | grep -qE '^[[:space:]]*(#|//)'; then
              block_len=$((block_len + 1))
            else
              [ "$block_len" -gt 5 ] && flagged="$flagged$nl  - $f: oversized comment block ($block_len lines)"
              block_len=0
            fi
            prev_lineno="$lineno"
          done < "$candidates"
          rm -f "$candidates"
          [ "$block_len" -gt 5 ] && flagged="$flagged$nl  - $f: oversized comment block ($block_len lines, end of file)"
        done 3< "$staged"
        rm -f "$staged"
        if [ -n "$flagged" ]; then
          echo "⚠ comment hygiene (commit still proceeds):"
          printf '%s\n' "$flagged"
        fi
        exit 0

commit-msg:
  commands:
    conventional:
      run: bash .lefthook/commit-msg.sh {1}
pre-push:
  commands:
    harness-integrity:
      run: bash .claude/verify-harness.sh
    docs-check:
      run: bash scripts/check-docs.sh
    test-budget:
      run: bash scripts/test-budget.sh
    verify:
      run: '[ -f .venv/bin/activate ] && . .venv/bin/activate; ruff check src/ test/ && python -m pyright src/ && python -m pytest test/ -q'
