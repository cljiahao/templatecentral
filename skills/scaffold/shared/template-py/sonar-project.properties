# SonarQube / SonarCloud project settings. Set sonar.projectKey (and sonar.organization on SonarCloud)
# where the project is registered, then run the scanner from CI with a project-owned token and host URL.
# Targets the default "Sonar way" gate: new-code coverage >= 80%, duplication on new code <= 3%.
sonar.sources=src
sonar.tests=test
sonar.exclusions=**/__pycache__/**
sonar.python.version=3.14
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8
