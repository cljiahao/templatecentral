[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
# `select`, not `extend-select`: ruff >=0.16 enables ~413 rules by default, and this is the
# deliberate scaffold-verified set. Per-tier and deferral rationale: templatecentral:standards
# code-standards (fastapi.md, comments.md).
select = [
  "E4", "E7", "E9", "F", "I",
  "S", "B", "FAST", "SIM", "C4", "RET", "PT", "PIE", "UP",
  "ERA", "PGH003", "PGH004", "RUF100", "TD005",
  # Approximates the SonarQube Python profile (Sonar remains the gate): C901 is cyclomatic, not Sonar's
  # cognitive complexity; the rest cover parameter and return counts, unused arguments, global statements.
  "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "ARG",
  "PLW0602", "PLW0603", "PLW2901", "PLR1714", "PLR5501",
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
# Sonar rule python:S107 (too many parameters), whose default maximum is 7.
max-args = 7

[tool.ruff.lint.per-file-ignores]
# pytest fixtures/assertions and test doubles are not the bandit findings they look like.
"test/**/*.py" = ["S101", "S105"]

[tool.pytest.ini_options]
pythonpath = ["src", "test"]
# Run `async def test_*` as coroutine tests without per-test markers.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# Register a marker here before using it, so nothing warns.
markers = [
  "unit: fast tests with no external service",
  "integration: needs a running service",
]

addopts = [
    "--import-mode=importlib",
]
