name: AI PR Review

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check Claude credential
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error title=AI PR Review::CLAUDE_CODE_OAUTH_TOKEN is not set (or this PR comes from a fork, which gets no secrets). Generate one with 'claude setup-token' and store it as a repository secret."
            exit 1
          fi

      - id: claude
        uses: anthropics/claude-code-action@2dca132ff0e0c4094ce6048b422c6915a071210b # v1.0.247
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are reviewing a pull request for templateCentral — a Claude Code plugin
            that scaffolds Next.js, Vite+React, FastAPI, and NestJS projects.

            Review the diff against these priorities (in order):

            1. **Security** — hardcoded secrets in skill code blocks, missing auth patterns,
               injection vectors in generated code, insecure defaults.
            2. **Correctness** — skill references a deprecated API, wrong import path,
               broken code that would fail at runtime.
            3. **Convention** — SKILL.md description >150 chars, registered skill body >30 lines,
               implementation detail in a router-only skill.
            4. **Breaking changes** — scaffold file changes that alter output for existing
               projects without a migration path in CHANGELOG or `templatecentral:migrate`.

            Rules:
            - Cite file and line number for every finding.
            - Skip stylistic nitpicks and formatting opinions.
            - If a finding is already addressed in the PR description checklist, skip it.
            - If no issues found, say so in one line.

      # The action hides Claude's output, so an auth or usage-limit failure
      # shows only "is_error: true". Print the result text so the cause is visible.
      - name: Show Claude error
        if: failure() && steps.claude.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          jq -r '[.[] | select(.type == "result")] | last
            | (.result // (.errors | select(.) | tostring) // "no result text")
            | "::error title=AI PR Review::" + gsub("\n"; "%0A")' \
            "$EXECUTION_FILE"
