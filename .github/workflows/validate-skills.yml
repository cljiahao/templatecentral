name: Validate Skills

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    paths:
      - 'skills/**'
      - 'scripts/**'
      - 'tests/**'
      - 'adapters/**'
      - '.claude-plugin/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'AGENTS.md'
      - 'EXAMPLES.md'
      - 'CONTRIBUTING.md'
      - 'FUTURE.md'
      - 'SECURITY.md'
      - '.claude/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'skills/**'
      - 'scripts/**'
      - 'tests/**'
      - 'adapters/**'
      - '.claude-plugin/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'AGENTS.md'
      - 'EXAMPLES.md'
      - 'CONTRIBUTING.md'
      - 'FUTURE.md'
      - 'SECURITY.md'
      - '.claude/**'
      - '.github/workflows/**'

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Validate SKILL.md frontmatter
        run: |
          failed=0
          for skill_file in skills/*/SKILL.md; do
            first_line=$(head -1 "$skill_file")
            if [ "$first_line" != "---" ]; then
              echo "SKIP: $skill_file (no YAML frontmatter — internal utility)"
              continue
            fi

            name=$(grep -m1 '^name:' "$skill_file" | sed 's/name:[[:space:]]*//' | tr -d '"')
            description=$(grep -m1 '^description:' "$skill_file" | sed 's/description:[[:space:]]*//' | tr -d '"')

            file_ok=1
            if [ -z "$name" ]; then
              echo "FAIL: $skill_file — missing 'name' in frontmatter"
              failed=1
              file_ok=0
            fi
            if [ -z "$description" ]; then
              echo "FAIL: $skill_file — missing 'description' in frontmatter"
              failed=1
              file_ok=0
            fi
            if [ $file_ok -eq 1 ]; then
              echo "OK:   $skill_file"
            fi
          done

          if [ $failed -ne 0 ]; then
            echo ""
            echo "One or more skills have invalid frontmatter. Fix before merging."
            exit 1
          fi

      - name: Check all skill directories have a SKILL.md
        run: |
          failed=0
          for skill_dir in skills/*/; do
            skill_name=$(basename "$skill_dir")
            skill_file="${skill_dir}SKILL.md"
            if [ ! -f "$skill_file" ]; then
              echo "FAIL: skills/$skill_name/ exists but has no SKILL.md"
              failed=1
            fi
          done
          if [ $failed -ne 0 ]; then
            exit 1
          fi
          echo "All skill directories have a SKILL.md"

  lint-patterns:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install PyYAML for the yaml checks
        run: sudo apt-get update && sudo apt-get install -y python3-yaml
      - name: Run skill lint checks
        run: bash scripts/lint-skills.sh skills/

  plugin-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Validate manifest files
        env:
          STRICT_DOC_SYNC: "1"
        run: bash scripts/validate-manifest.sh .claude-plugin

  shell-lint:
    name: Shellcheck repo scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Install zsh for the copy-guard shell tests
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: shellcheck + bash -n
        run: |
          shellcheck scripts/*.sh
          for f in scripts/*.sh; do bash -n "$f"; done
      - name: Scaffold template scripts parse and pass shellcheck
        run: |
          set -euo pipefail
          t=skills/scaffold
          [ "$(find "$t" -path "$t/*/template*" -name '*.sh' | wc -l)" -gt 0 ] || { echo "no template scripts found"; exit 1; }
          [ "$(find "$t" -path "$t/*/template*" -name '*.py' | wc -l)" -gt 0 ] || { echo "no template python files found"; exit 1; }
          [ "$(find "$t" -path "$t/*/template*" -name '*.cjs' | wc -l)" -gt 0 ] || { echo "no template cjs files found"; exit 1; }
          [ "$(find "$t/nextjs/template" -name '*.sh' | wc -l)" -gt 0 ] || { echo "no nextjs template scripts found"; exit 1; }
          [ "$(find "$t/nextjs/template" -name '*.mjs' | wc -l)" -gt 0 ] || { echo "no nextjs template mjs files found"; exit 1; }
          [ "$(find "$t/nestjs/template" -name '*.sh' | wc -l)" -gt 0 ] || { echo "no nestjs template scripts found"; exit 1; }
          [ "$(find "$t/nestjs/template" -name '*.mjs' | wc -l)" -gt 0 ] || { echo "no nestjs template mjs files found"; exit 1; }
          [ "$(find "$t/fastapi/template" -name '*.sh' | wc -l)" -gt 0 ] || { echo "no fastapi template scripts found"; exit 1; }
          [ "$(find "$t/fastapi/template" -name '*.py' | wc -l)" -gt 0 ] || { echo "no fastapi template python files found"; exit 1; }
          [ "$(find "$t/vite-react/template" -name '*.sh' | wc -l)" -gt 0 ] || { echo "no vite-react template scripts found"; exit 1; }
          [ "$(find "$t/vite-react/template" -name '*.mjs' | wc -l)" -gt 0 ] || { echo "no vite-react template mjs files found"; exit 1; }
          [ "$(find "$t/vite-react/template" -name '*.envsh' | wc -l)" -gt 0 ] || { echo "no vite-react template envsh files found"; exit 1; }
          find "$t" -path "$t/*/template*" \( -name '*.sh' -o -name '*.envsh' \) -print0 | xargs -0 -r -n1 bash -n
          find "$t" -path "$t/*/template*" \( -name '*.sh' -o -name '*.envsh' \) -print0 | xargs -0 -r shellcheck --severity=warning
          find "$t" -path "$t/*/template*" -name '*.py' -print0 | xargs -0 -r -n1 python3 -c 'import os, py_compile, sys, tempfile; py_compile.compile(sys.argv[1], cfile=os.path.join(tempfile.mkdtemp(), "x.pyc"), doraise=True)'
          find "$t" -path "$t/*/template*" \( -name '*.cjs' -o -name '*.mjs' \) -print0 | xargs -0 -r -n1 node --check
      - name: pre-guard.sh behavioral test
        run: bash scripts/pre-guard.test.sh
      - name: Seeded harness-kit hook regression tests
        run: bash scripts/test-harness-kit.sh
      - name: Research content guard tests
        run: bash scripts/check-research-content.test.sh
      - name: Fence extractor tests
        run: bash scripts/extract-fences.test.sh
      - name: Golden scaffold tree tests
        run: bash scripts/check-golden.test.sh
      - name: Golden scaffold tree check
        run: bash scripts/check-golden.sh
      - name: Golden scaffold tree check (template trees)
        run: bash scripts/check-golden.sh --from-templates
      - name: Template copy tests
        run: bash scripts/test-template-copy.sh
      - name: Token counter tests
        run: bash scripts/count-load.test.sh
      - name: Skill fence snapshot tests
        run: bash scripts/check-fences.test.sh
      - name: Fence snapshot freeze tests
        run: bash scripts/check-fences-frozen.test.sh
      - name: Skill fence snapshot check
        run: bash scripts/check-fences.sh
      - name: Skill fence snapshot check (template files)
        run: |
          rc=0
          bash scripts/check-fences.sh --has-mappings || rc=$?
          if [ "$rc" -eq 0 ]; then
            bash scripts/check-fences.sh --from-templates
          elif [ "$rc" -eq 1 ]; then
            echo "no fence is mapped to a template file yet"
          else
            echo "check-fences --has-mappings failed with exit $rc"
            exit "$rc"
          fi

  lint-negative-tests:
    name: Lint check negative tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install PyYAML for the yaml checks
        run: sudo apt-get update && sudo apt-get install -y python3-yaml
      - name: Each lint check fails on an empty match and on a deleted anchor
        run: bash scripts/lint-skills.test.sh

  fence-snapshot-frozen:
    name: Fence snapshot unchanged
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Fail when the fence snapshot changed without the fence-snapshot-change label
        env:
          BASE_REF: ${{ github.base_ref }}
          FENCE_SNAPSHOT_CHANGE_OK: ${{ contains(github.event.pull_request.labels.*.name, 'fence-snapshot-change') && '1' || '' }}
        run: bash scripts/check-fences-frozen.sh "origin/$BASE_REF"

  token-count:
    name: Scaffold load size
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Count tokens against origin/main
        continue-on-error: true
        run: |
          {
            echo '## Scaffold load vs origin/main'
            echo '```'
            bash scripts/count-load.sh --base origin/main
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Count add, migrate and standards load against origin/main
        continue-on-error: true
        run: |
          {
            echo '## Add, migrate and standards load vs origin/main'
            echo '```'
            bash scripts/count-load.sh --summary all --base origin/main
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  opencode-adapter-tests:
    name: OpenCode adapter hook tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Run hooks.test.mjs
        run: node adapters/opencode/hooks.test.mjs
