name: Validate Skills

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    paths:
      - 'skills/**'
      - 'scripts/**'
      - 'tests/**'
      - 'adapters/**'
      - '.claude-plugin/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'AGENTS.md'
      - 'EXAMPLES.md'
      - 'CONTRIBUTING.md'
      - 'FUTURE.md'
      - 'SECURITY.md'
      - '.claude/**'
      - '.github/workflows/**'
  pull_request:
    # labeled/unlabeled re-run the workflow so the "Fence snapshot unchanged" job re-reads the
    # fence-snapshot-change label; without them a label added after the run began is never seen.
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Validate SKILL.md frontmatter
        run: |
          failed=0
          for skill_file in skills/*/SKILL.md; do
            first_line=$(head -1 "$skill_file")
            if [ "$first_line" != "---" ]; then
              echo "SKIP: $skill_file (no YAML frontmatter — internal utility)"
              continue
            fi

            name=$(grep -m1 '^name:' "$skill_file" | sed 's/name:[[:space:]]*//' | tr -d '"')
            description=$(grep -m1 '^description:' "$skill_file" | sed 's/description:[[:space:]]*//' | tr -d '"')

            file_ok=1
            if [ -z "$name" ]; then
              echo "FAIL: $skill_file — missing 'name' in frontmatter"
              failed=1
              file_ok=0
            fi
            if [ -z "$description" ]; then
              echo "FAIL: $skill_file — missing 'description' in frontmatter"
              failed=1
              file_ok=0
            fi
            if [ $file_ok -eq 1 ]; then
              echo "OK:   $skill_file"
            fi
          done

          if [ $failed -ne 0 ]; then
            echo ""
            echo "One or more skills have invalid frontmatter. Fix before merging."
            exit 1
          fi

      - name: Check all skill directories have a SKILL.md
        run: |
          failed=0
          for skill_dir in skills/*/; do
            skill_name=$(basename "$skill_dir")
            skill_file="${skill_dir}SKILL.md"
            if [ ! -f "$skill_file" ]; then
              echo "FAIL: skills/$skill_name/ exists but has no SKILL.md"
              failed=1
            fi
          done
          if [ $failed -ne 0 ]; then
            exit 1
          fi
          echo "All skill directories have a SKILL.md"

  lint-patterns:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install PyYAML for the yaml checks
        run: sudo apt-get update && sudo apt-get install -y python3-yaml
      - name: Run skill lint checks
        run: bash scripts/lint-skills.sh skills/

  plugin-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Validate manifest files
        env:
          STRICT_DOC_SYNC: "1"
        run: bash scripts/validate-manifest.sh .claude-plugin

  shell-lint:
    name: Shellcheck repo scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Install PyYAML for the test wiring check
        run: sudo apt-get update && sudo apt-get install -y python3-yaml
      - name: shellcheck + bash -n
        run: |
          shellcheck scripts/*.sh
          for f in scripts/*.sh; do bash -n "$f"; done
      - name: Scaffold copy script is present, parses and passes shellcheck
        run: |
          set -euo pipefail
          f=skills/scaffold/shared/tc-copy.sh
          [ -x "$f" ] || { echo "$f is missing or not executable"; exit 1; }
          [ "$(find skills -name 'tc-copy*.sh' | wc -l)" -eq 1 ] || { echo "skills/ must hold exactly one copy script"; exit 1; }
          bash -n "$f"
          shellcheck "$f"
      - name: Scaffold template scripts parse and pass shellcheck
        run: |
          set -euo pipefail
          t=skills/scaffold
          [ "$(find "$t" -path "$t/*/template*" -name '*.sh' | wc -l)" -gt 0 ] || { echo "no template scripts found"; exit 1; }
          [ "$(find "$t" -path "$t/*/template*" -name '*.py' | wc -l)" -gt 0 ] || { echo "no template python files found"; exit 1; }
          [ "$(find "$t" -path "$t/*/template*" -name '*.cjs' | wc -l)" -gt 0 ] || { echo "no template cjs files found"; exit 1; }
          [ "$(find "$t/nextjs/template" -name '*.sh' | wc -l)" -gt 0 ] || { echo "no nextjs template scripts found"; exit 1; }
          [ "$(find "$t/nextjs/template" -name '*.mjs' | wc -l)" -gt 0 ] || { echo "no nextjs template mjs files found"; exit 1; }
          [ "$(find "$t/nestjs/template" -name '*.sh' | wc -l)" -gt 0 ] || { echo "no nestjs template scripts found"; exit 1; }
          [ "$(find "$t/nestjs/template" -name '*.mjs' | wc -l)" -gt 0 ] || { echo "no nestjs template mjs files found"; exit 1; }
          [ "$(find "$t/fastapi/template" -name '*.sh' | wc -l)" -gt 0 ] || { echo "no fastapi template scripts found"; exit 1; }
          [ "$(find "$t/fastapi/template" -name '*.py' | wc -l)" -gt 0 ] || { echo "no fastapi template python files found"; exit 1; }
          [ "$(find "$t/vite-react/template" -name '*.sh' | wc -l)" -gt 0 ] || { echo "no vite-react template scripts found"; exit 1; }
          [ "$(find "$t/vite-react/template" -name '*.mjs' | wc -l)" -gt 0 ] || { echo "no vite-react template mjs files found"; exit 1; }
          [ "$(find "$t/vite-react/template" -name '*.envsh' | wc -l)" -gt 0 ] || { echo "no vite-react template envsh files found"; exit 1; }
          find "$t" -path "$t/*/template*" \( -name '*.sh' -o -name '*.envsh' \) -print0 | xargs -0 -r -n1 bash -n
          find "$t" -path "$t/*/template*" \( -name '*.sh' -o -name '*.envsh' \) -print0 | xargs -0 -r shellcheck --severity=warning
          find "$t" -path "$t/*/template*" -name '*.py' -print0 | xargs -0 -r -n1 python3 -c 'import os, py_compile, sys, tempfile; py_compile.compile(sys.argv[1], cfile=os.path.join(tempfile.mkdtemp(), "x.pyc"), doraise=True)'
          find "$t" -path "$t/*/template*" \( -name '*.cjs' -o -name '*.mjs' \) -print0 | xargs -0 -r -n1 node --check
      - name: pre-guard.sh behavioral test
        run: bash scripts/pre-guard.test.sh
      - name: Seeded test budget script tests
        run: bash scripts/test-budget.test.sh
      - name: Seeded supply-chain, workflow, env-example and Dockerfile checks
        run: bash scripts/supply-chain.test.sh
      - name: Seeded Dockerfiles pass the dockerfile gate with real hadolint
        run: bash scripts/seeded-dockerfiles.test.sh
      - name: Every scripts/*.test.sh file is run by a workflow step
        run: bash scripts/check-tests-wired.sh
      - name: Wiring check tests
        run: bash scripts/check-tests-wired.test.sh
      - name: Workflow job id reader tests
        run: bash scripts/workflow-job-ids.test.sh
      - name: Local changed-gates runner tests
        run: bash scripts/run-gates.test.sh

  seeded-gate-tests:
    name: Seeded gate tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Seeded harness-kit hook regression tests
        run: bash scripts/test-harness-kit.sh
      - name: Seeded workaround detector, secret scan, nosonar and diff-coverage gates and hook messages
        run: bash scripts/seeded-gates.test.sh
      - name: Seeded gate-time budget, record, check, hook and ratchet guards
        run: bash scripts/gate-budget.test.sh
      - name: Seeded review gate, its wiring probes and the harness removal script
        run: |
          bash scripts/seeded-review-gate.test.sh
          bash scripts/seeded-remove-harness.test.sh
      - name: Day-one proof, every stack and CI host passes its offline seeded gates
        run: bash scripts/day-one.test.sh
      - name: Install PyYAML for the CI template guard
        run: |
          python3 -m venv "$RUNNER_TEMP/ci-templates-venv"
          "$RUNNER_TEMP/ci-templates-venv/bin/pip" install "pyyaml==6.0.3"
          echo "$RUNNER_TEMP/ci-templates-venv/bin" >> "$GITHUB_PATH"
      - name: Seeded CI template tests
        run: bash scripts/test-ci-templates.sh

  keyless-gate-tests:
    name: Keyless gate tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '26'
      - name: Enable the pnpm that each scaffold pins
        run: corepack enable
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: '0.13.7'
      - name: Seeded licence gate and its real scaffold runs
        run: bash scripts/seeded-licences.test.sh
      - name: Seeded SBOM gate and its real scaffold runs
        run: bash scripts/seeded-sbom.test.sh
      - name: Seeded bundle size gate and its real scaffold builds
        run: bash scripts/seeded-bundle-size.test.sh
      - name: Seeded change size gate
        run: bash scripts/seeded-change-size.test.sh
      - name: Seeded gate ratchet tests
        run: bash scripts/gate-ratchet.test.sh
      - name: Seeded lock file parser fuzz against pip
        run: bash scripts/seeded-lock-parser-fuzz.test.sh

  golden-tests:
    name: Golden scaffold tree tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Golden regeneration script tests
        run: bash scripts/regen-golden.test.sh
      - name: Research content guard tests
        run: bash scripts/check-research-content.test.sh
      - name: Fence extractor tests
        run: bash scripts/extract-fences.test.sh
      - name: Golden scaffold tree tests
        run: bash scripts/check-golden.test.sh
      - name: Golden scaffold tree check
        run: bash scripts/check-golden.sh
      - name: Golden scaffold tree check (template trees)
        run: bash scripts/check-golden.sh --from-templates
      - name: Template and guide comment policy
        run: bash scripts/check-template-comments.sh

  template-copy-tests:
    name: Template copy tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Install zsh for the copy-guard shell tests
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Template copy tests
        run: bash scripts/test-template-copy.sh

  version-docs-tests:
    name: Version, docs and load tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Token counter tests
        run: bash scripts/count-load.test.sh
      - name: Outcome measurement tests
        run: bash scripts/measure-outcomes.test.sh
      - name: Template outcome metrics (comments, suppressions, test band, CI gates)
        run: bash scripts/measure-outcomes.sh
      - name: Seeded load measurement tests
        run: bash scripts/measure-seeded-load.test.sh
      - name: Seeded load (always-loaded bytes, duplicates, hook output caps)
        run: bash scripts/measure-seeded-load.sh
      - name: Post-edit lint hook tests
        run: bash scripts/post-edit-lint.test.sh
      - name: Docs check tests
        run: bash scripts/check-docs.test.sh
      - name: Doc sync tests
        run: bash scripts/check-doc-sync.test.sh
      - name: Doc sync (README, EXAMPLES, AGENTS capability row)
        run: bash scripts/check-doc-sync.sh
      - name: Version check tests (planted drift)
        run: bash scripts/check-versions.test.sh
      - name: Versions agree with skills/scaffold/shared/versions.txt
        run: bash scripts/check-versions.sh
      - name: Migrate scripts parse and pass shellcheck
        run: |
          set -euo pipefail
          for f in skills/migrate/general/quality-baseline.sh skills/migrate/general/harness-live.sh skills/migrate/general/harness-refresh.sh; do
            [ -x "$f" ] || { echo "$f is missing or not executable"; exit 1; }
            bash -n "$f"
            shellcheck "$f"
          done
      - name: Quality baseline script tests
        run: bash scripts/quality-baseline.test.sh
      - name: Review scope and remove-example scripts parse and pass shellcheck
        run: |
          set -euo pipefail
          for f in skills/review/review/review-scope.sh skills/cleanup/remove-example/remove-example.sh; do
            [ -x "$f" ] || { echo "$f is missing or not executable"; exit 1; }
            bash -n "$f"
            shellcheck "$f"
          done
      - name: Review scope script tests
        run: bash scripts/review-scope.test.sh
      - name: Remove-example script tests
        run: bash scripts/remove-example.test.sh
      - name: Remove-example edge tests
        run: bash scripts/remove-example-edge.test.sh
      - name: Skill fence snapshot tests
        run: bash scripts/check-fences.test.sh
      - name: Fence snapshot freeze tests
        run: bash scripts/check-fences-frozen.test.sh
      - name: Skill fence snapshot check
        run: bash scripts/check-fences.sh
      - name: Skill fence snapshot check (template files)
        run: |
          rc=0
          bash scripts/check-fences.sh --has-mappings || rc=$?
          if [ "$rc" -eq 0 ]; then
            bash scripts/check-fences.sh --from-templates
          elif [ "$rc" -eq 1 ]; then
            echo "no fence is mapped to a template file yet"
          else
            echo "check-fences --has-mappings failed with exit $rc"
            exit "$rc"
          fi

  harness-tests:
    name: Harness live and refresh tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Harness live check tests
        run: bash scripts/harness-live.test.sh
      - name: Harness refresh tests
        run: bash scripts/harness-refresh.test.sh

  sonar-parity-tests:
    name: Sonar parity tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Sonar parity check tests
        run: bash scripts/check-sonar-parity.test.sh

  defect-report-tests:
    name: Migrate defect report tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Migrate defect report tests
        run: bash scripts/defect-report.test.sh

  migrate-baseline-tests:
    name: Migrate gate baseline tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Migrate gate baseline tests
        run: bash scripts/migrate-baseline.test.sh

  lint-negative-tests:
    name: Lint check negative tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install PyYAML for the yaml checks
        run: sudo apt-get update && sudo apt-get install -y python3-yaml
      - name: Each lint check fails on an empty match and on a deleted anchor
        run: bash scripts/lint-skills.test.sh
      - name: The probe pool of that test reports crashed, truncated and missing probes
        run: bash scripts/lint-skills-pool.test.sh

  fence-snapshot-frozen:
    name: Fence snapshot unchanged
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Fail when the fence snapshot changed without the fence-snapshot-change label
        env:
          BASE_REF: ${{ github.base_ref }}
          FENCE_SNAPSHOT_CHANGE_OK: ${{ contains(github.event.pull_request.labels.*.name, 'fence-snapshot-change') && '1' || '' }}
        run: bash scripts/check-fences-frozen.sh "origin/$BASE_REF"

  line-budget-frozen:
    name: Line-budget allowance unchanged
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Line-budget allowance check tests
        run: bash scripts/check-line-budget-frozen.test.sh
      - name: Fail when a line-budget allowance grew
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/check-line-budget-frozen.sh "origin/$BASE_REF"

  token-count:
    name: Scaffold load size
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Count tokens against origin/main
        continue-on-error: true
        run: |
          {
            echo '## Scaffold load vs origin/main'
            echo '```'
            bash scripts/count-load.sh --base origin/main
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Count add, migrate and standards load against origin/main
        continue-on-error: true
        run: |
          {
            echo '## Add, migrate and standards load vs origin/main'
            echo '```'
            bash scripts/count-load.sh --summary all --base origin/main
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  opencode-adapter-tests:
    name: OpenCode adapter hook tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Run hooks.test.mjs
        run: node adapters/opencode/hooks.test.mjs

  # The one check to require in branch protection. It runs even when a job failed or was cancelled
  # (if: always()) and fails unless every job in `needs` finished with result success. The only jobs
  # that may be skipped are fence-snapshot-frozen and line-budget-frozen, and only on a push, where
  # their own `if` skips them by design; on a pull request they must succeed. It also fails when a
  # job of this workflow is missing from `needs`, so a new job cannot be left out of the aggregate
  # unnoticed.
  all-checks:
    name: All checks
    if: always()
    needs:
      - validate
      - lint-patterns
      - plugin-validate
      - shell-lint
      - seeded-gate-tests
      - keyless-gate-tests
      - golden-tests
      - template-copy-tests
      - version-docs-tests
      - harness-tests
      - sonar-parity-tests
      - defect-report-tests
      - migrate-baseline-tests
      - lint-negative-tests
      - fence-snapshot-frozen
      - line-budget-frozen
      - token-count
      - opencode-adapter-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Every job succeeded, or was skipped by design
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          bad=$(jq -r --arg ev "$EVENT" '
            to_entries[]
            | select(if (.key == "fence-snapshot-frozen" or .key == "line-budget-frozen") and $ev != "pull_request"
                     then .value.result != "skipped"
                     else .value.result != "success" end)
            | "\(.key)=\(.value.result)"' <<<"$NEEDS")
          if [ -n "$bad" ]; then
            echo "Jobs that did not pass:"
            echo "$bad"
            exit 1
          fi
          in_file=$(bash scripts/workflow-job-ids.sh .github/workflows/validate-skills.yml | grep -vx all-checks | sort)
          in_needs=$(jq -r 'keys[]' <<<"$NEEDS" | sort)
          if [ "$in_file" != "$in_needs" ]; then
            echo "The jobs of this workflow and the needs of all-checks differ:"
            diff <(echo "$in_file") <(echo "$in_needs") || true
            exit 1
          fi
          echo "All $(echo "$in_needs" | wc -l | tr -d ' ') jobs passed or were skipped by design"
